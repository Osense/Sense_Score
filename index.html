<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./brand/wsns-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f6f9" />
    <link rel="stylesheet" href="./fonts/pretendard/pretendardvariable-dynamic-subset.css" />
    <script>
      // 테마를 그리기 전에 정해서 깜빡임을 막는다 (저장값 → 기기 설정)
      try {
        var t = localStorage.getItem('sense-score:theme')
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <meta name="description" content="기기 안에서 작곡하고 자동 저장하는 Sense Score 음악 작업실" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Sense Score · 작곡 놀이터</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
